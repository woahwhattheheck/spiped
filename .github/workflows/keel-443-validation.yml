name: KEEL spiped 443 pthread validation

on:
  push:
    branches:
      - review/keel-443-pthread-validation-20260906
    paths:
      - .github/workflows/keel-443-validation.yml
      - tests/keel-443/**

permissions: {}

jobs:
  build-and-fault-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch exact validation code and source revisions
        shell: bash
        run: |
          set -euo pipefail
          git init validation
          git -C validation remote add origin https://github.com/woahwhattheheck/spiped.git
          git -C validation fetch --depth=1 origin "$GITHUB_SHA"
          git -C validation checkout --detach FETCH_HEAD
          test "$(git -C validation rev-parse HEAD)" = "$GITHUB_SHA"
          git init target
          git -C target remote add origin https://github.com/woahwhattheheck/spiped.git
          git -C target fetch --depth=1 origin e20e9a36070b31c5832bd342a5c98b0b1cf3bf4c
          git -C target checkout --detach FETCH_HEAD
          test "$(git -C target rev-parse HEAD)" = e20e9a36070b31c5832bd342a5c98b0b1cf3bf4c
          git -C target submodule update --init --recursive
          git -C target fetch --depth=1 origin a945f3315e35ee48c8a79af952addc1b6616db83
          mkdir -p validation/tests/keel-443/sources
          git -C target show a945f3315e35ee48c8a79af952addc1b6616db83:lib/util/pthread_create_blocking_np.c > validation/tests/keel-443/sources/base.c
          cp target/lib/util/pthread_create_blocking_np.c validation/tests/keel-443/sources/head.c
          cp target/lib/util/pthread_create_blocking_np.h validation/tests/keel-443/sources/
          cp target/libcperciva/util/warnp.c target/libcperciva/util/warnp.h validation/tests/keel-443/sources/
      - name: Normal full build of the exact PR 443 head
        shell: bash
        run: |
          set -euo pipefail
          gcc --version | head -n 1
          make --version | head -n 1
          openssl version
          printf 'SOURCE '
          git -C target rev-parse HEAD:lib/util/pthread_create_blocking_np.c
          if ! make -C target -j2 > build-443.log 2>&1; then
            tail -n 160 build-443.log
            exit 1
          fi
          test -x target/spiped/spiped
          test -x target/spipe/spipe
          echo 'BUILD PR443 PASS'
          tail -n 8 build-443.log
      - name: Real pthread and AddressSanitizer ownership regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/tests/keel-443/run_fault_tests.py
          cat validation/tests/keel-443/fault_results.json
          printf '## KEEL spiped 443\n\nFull build passed. All 10 fault/control outcomes matched; three baseline sanitizer failures are asserted and the fixed paths pass.\n\nSynthetic error injection is not a claim about real-world occurrence or untested interleavings.\n' >> "$GITHUB_STEP_SUMMARY"
